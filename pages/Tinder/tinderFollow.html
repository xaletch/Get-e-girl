<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tinder Follow</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link rel="stylesheet" href="../../assets/styles/ui.css" />
    <link rel="stylesheet" href="../../assets/styles/components/header.css" />
    <link rel="stylesheet" href="../../assets/styles/components/navbar.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/tinder/tinder.css"
    />
  </head>
  <body>
    <div class="app">
      <div class="navbar">
        <div class="navbar__wrapper">
          <div class="navbar__head">
            <div class="navbar__head-inner">
              <div class="navbar__head-name">Chats</div>
              <div class="navbar__head-icon">
                <svg width="22" height="21">
                  <use href="../../assets/icon/icons.svg#chat"></use>
                </svg>
              </div>
            </div>
          </div>
          <div class="navbar__chats">
            <div class="navbar__chats-wrapper">
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat online">
                <img src="../../assets/images/girl-2.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-2.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
            </div>
          </div>
        </div>
      </div>

      <header class="header header-l header-big-l">
        <div class="container-xl">
          <div class="header__wrapper">
            <a href="#" class="header-logo">
              <svg width="80" height="49">
                <use href="../../../assets/icon/icons.svg#logo-eye"></use>
              </svg>
            </a>
            <div class="header__left">
              <a href="#" class="header-logo-eye">
                <svg width="80" height="49">
                  <use href="../../../assets/icon/icons.svg#logo-eye"></use>
                </svg>
              </a>
              <!--  -->
              <div class="header__buttons">
                <!-- Уведомления -->
                <button class="header__buttons-btn">
                  <div class="notification-count">12</div>
                  <span>
                    <svg width="18" height="20">
                      <use
                        href="../../../assets/icon/icons.svg#notification"
                      ></use>
                    </svg>
                  </span>
                  <div class="header__buttons-arrow"></div>
                </button>
                <!-- Язык -->
                <button class="header__buttons-btn">
                  <span class="lang">
                    <svg width="28" height="20">
                      <use href="../../../assets/icon/icons.svg#russia"></use>
                    </svg>
                  </span>
                  <div class="header__buttons-arrow"></div>
                </button>
                <!-- Настройки -->
                <a
                  href="../profileSetting/profile.html"
                  class="header__buttons-btn"
                >
                  <span>
                    <svg width="20" height="20">
                      <use href="../../../assets/icon/icons.svg#setting"></use>
                    </svg>
                  </span>
                </a>
                <button class="header__buttons-btn header__button-menu">
                  <svg width="24" height="24">
                    <use href="../../../assets/icon/icons.svg#menu"></use>
                  </svg>
                </button>
              </div>
            </div>
            <!--  -->
            <nav class="header__naw">
              <ul class="header__naw-list">
                <li class="header__list-item">
                  <a href="../profile/myProfile/feeds.html">Feeds</a>
                </li>
                <li class="header__list-item">
                  <a href="../MySubscribers/subscribers.html">My E-girls</a>
                </li>
                <li class="header__list-item header__list-item__logo">
                  <a href="#">
                    <svg width="220" height="32">
                      <use
                        href="../../../assets/icon/icons.svg#logo-text"
                      ></use>
                    </svg>
                  </a>
                </li>
                <li class="header__list-item">
                  <a href="../MyContent/myContent.html">My Сontent</a>
                </li>
                <li class="header__list-item">
                  <a href="../Orders/orders.html">Orders</a>
                </li>
              </ul>
            </nav>
            <div class="header__user-info">
              <!-- БАЛАНС -->
              <a href="../balance/finance.html" class="user-balance">
                <span class="balance-h">$12 310</span>
              </a>
              <!-- УВЕДОМЛЕНИЯ -->
              <button href="#" class="header__buttons-btn header__notif-btn">
                <div class="notification-count">12</div>
                <span>
                  <svg width="18" height="20">
                    <use
                      href="../../../assets/icon/icons.svg#notification"
                    ></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- ПОЛЬЗОВАТЕЛЬ -->
              <div class="user">
                <div class="user-img">
                  <img src="../../../assets/images/user.png" alt="user" />
                </div>
                <div class="user-name">@MoraruV</div>
              </div>
              <!-- МЕНЮ -->
              <button class="header__buttons-btn header__notif-btn">
                <svg width="24" height="24">
                  <use href="../../../assets/icon/icons.svg#menu"></use>
                </svg>
              </button>
            </div>
            <div class="header__buttons">
              <!-- Уведомления -->
              <button class="header__buttons-btn">
                <div class="notification-count">12</div>
                <span>
                  <svg width="18" height="20">
                    <use
                      href="../../../assets/icon/icons.svg#notification"
                    ></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Язык -->
              <button class="header__buttons-btn">
                <span class="lang">
                  <svg width="28" height="20">
                    <use href="../../../assets/icon/icons.svg#russia"></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Настройки -->
              <a
                href="../profileSetting/profile.html"
                class="header__buttons-btn"
              >
                <span>
                  <svg width="20" height="20">
                    <use href="../../../assets/icon/icons.svg#setting"></use>
                  </svg>
                </span>
              </a>
              <button class="header__buttons-btn header__button-menu">
                <svg width="24" height="24">
                  <use href="../../../assets/icon/icons.svg#menu"></use>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section class="tinder">
          <div class="container-lg">
            <div class="tinder__wrapper">
              <div
                class="tinder__content"
                style="background-image: url(../../assets/images/tinder.png)"
              >
                <div class="tinder__content-inner">
                  <!-- head -->
                  <div class="tinder__content-head">
                    <div class="tinder-user">
                      <img
                        src="../../assets/images/subscribers-1.png"
                        alt="user"
                        class="tinder__user-img"
                      />
                      <div class="tinder__username">
                        <h2>Булгари Кристина</h2>
                        <div class="username">
                          <span class="verified-account">
                            <svg width="18" height="18">
                              <use
                                href="../../../assets/icon/icons.svg#verified-account"
                              ></use>
                            </svg>
                          </span>
                          <a href="#">@Biancalop</a>
                        </div>
                      </div>
                    </div>
                    <button class="tinder-setting">
                      <svg width="32" height="32">
                        <use
                          href="../../../assets/icon/icons.svg#tinder-setting"
                        ></use>
                      </svg>
                    </button>
                  </div>

                  <!-- next -->
                  <div class="tinder__next-button">
                    <button class="button-pre tinder__next-btn" disabled>
                      <svg width="22" height="36">
                        <use
                          href="../../../assets/icon/icons.svg#next-post"
                        ></use>
                      </svg>
                    </button>
                    <button class="button-next tinder__next-btn">
                      <svg width="22" height="36">
                        <use
                          href="../../../assets/icon/icons.svg#next-post"
                        ></use>
                      </svg>
                    </button>
                  </div>

                  <!-- content -->
                  <div class="tinder__block-content">
                    <img
                      class="tinder__content-img"
                      src="../../assets/images/tinder.png"
                      alt="tinder"
                    />
                    <div class="tinder__content-button">
                      <button class="tinder-follow followed">
                        <span>
                          <svg width="17" height="13">
                            <use
                              href="../../../assets/icon/icons.svg#check-mark-follow"
                            ></use>
                          </svg> </span
                        >Followed
                      </button>
                      <div class="tinder__content-scroll">
                        <div class="scroll-dot"></div>
                        <div class="scroll-dot"></div>
                        <div class="scroll-dot dot-border"></div>
                        <div class="scroll-dot"></div>
                        <div class="scroll-dot"></div>
                        <div class="scroll-dot"></div>
                        <div class="scroll-dot not-viewed"></div>
                        <div class="scroll-dot not-viewed"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tinder__scroll-button">
                <button class="scroll-button button-top">
                  <svg width="16" height="20">
                    <use href="../../../assets/icon/icons.svg#arrow-next"></use>
                  </svg>
                </button>
                <button class="scroll-button button-bottom">
                  <svg width="16" height="20">
                    <use href="../../../assets/icon/icons.svg#arrow-next"></use>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
