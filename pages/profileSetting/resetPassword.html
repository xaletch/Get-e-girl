<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Смена пароля</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link rel="stylesheet" href="../../assets/styles/ui.css" />
    <link rel="stylesheet" href="../../assets/styles/components/header.css" />
    <link rel="stylesheet" href="../../assets/styles/components/navbar.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/setting/setting.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/mobileNavigation.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/notification.css"
    />
  </head>
  <body>
    <div class="app">
      <div class="navbar">
        <div class="navbar__wrapper">
          <div class="navbar__head">
            <div class="navbar__head-inner">
              <div class="navbar__head-name">Chats</div>
              <div class="navbar__head-icon">
                <svg width="22" height="21">
                  <use href="../../assets/icon/icons.svg#chat"></use>
                </svg>
              </div>
            </div>
          </div>
          <div class="navbar__chats">
            <div class="navbar__chats-wrapper">
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat online">
                <img src="../../assets/images/girl-2.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-2.png" alt="girl" />
              </a>
              <a href="#" class="navbar__chat">
                <img src="../../assets/images/girl-1.png" alt="girl" />
              </a>
            </div>
          </div>
        </div>
      </div>

      <header class="header header-l">
        <div class="container">
          <div class="header__wrapper">
            <a href="#" class="header-logo">
              <svg width="180" height="54">
                <use href="../../assets/icon/icons.svg#logo_white"></use>
              </svg>
            </a>
            <nav class="header__naw">
              <ul class="header__naw-list">
                <li class="header__list-item">
                  <a href="#">Feeds</a>
                </li>
                <li class="header__list-item">
                  <a href="#">My E-girls</a>
                </li>
                <li class="header__list-item">
                  <a href="#">My Сontent</a>
                </li>
                <li class="header__list-item">
                  <a href="../Orders/orders.html">Orders</a>
                </li>
              </ul>
            </nav>
            <div class="header__user-info">
              <!-- БАЛАНС -->
              <a href="../balance/finance.html" class="user-balance">
                <span class="balance-h">$12 310</span>
              </a>
              <!-- УВЕДОМЛЕНИЯ -->
              <button href="#" class="header__buttons-btn header__notif-btn">
                <div class="notification-count">12</div>
                <span>
                  <svg width="18" height="20">
                    <use href="../../assets/icon/icons.svg#notification"></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- ПОЛЬЗОВАТЕЛЬ -->
              <div class="user">
                <div class="user-img">
                  <img src="../../assets/images/user.png" alt="user" />
                </div>
                <div class="user-name">@MoraruV</div>
              </div>
              <!-- МЕНЮ -->
              <button class="header__buttons-btn header__notif-btn">
                <svg width="24" height="24">
                  <use href="../../assets/icon/icons.svg#menu"></use>
                </svg>
              </button>
            </div>
            <div class="header__buttons">
              <!-- Уведомления -->
              <button class="header__buttons-btn">
                <div class="notification-count">12</div>
                <span>
                  <svg width="18" height="20">
                    <use href="../../assets/icon/icons.svg#notification"></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Язык -->
              <button class="header__buttons-btn">
                <span class="lang">
                  <svg width="28" height="20">
                    <use href="../../assets/icon/icons.svg#russia"></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Настройки -->
              <a href="./resetPassword.html" class="header__buttons-btn">
                <span>
                  <svg width="20" height="20">
                    <use href="../../assets/icon/icons.svg#setting"></use>
                  </svg>
                </span>
              </a>
              <button class="header__buttons-btn header__button-menu">
                <svg width="24" height="24">
                  <use href="../../assets/icon/icons.svg#menu"></use>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section class="profile">
          <div class="container">
            <h1 class="title-page">Личный кабинет</h1>
            <div class="profile__wrapper">
              <div class="profile__navbar">
                <div class="profile__navbar-wrapper">
                  <a href="./profile.html" class="profile__navbar-item">
                    <span class="profile__navbar-icon">
                      <svg width="20" height="23" class="icon-svg">
                        <use href="../../assets/icon/icons.svg#edit"></use>
                      </svg>
                    </span>
                    <p class="profile__navbar-name">Редактировать профиль</p>
                  </a>
                  <div class="line"></div>
                  <a href="#" class="profile__navbar-item">
                    <span class="profile__navbar-icon">
                      <svg width="19" height="19" class="icon-svg">
                        <use
                          href="../../assets/icon/icons.svg#profile_setting"
                        ></use>
                      </svg>
                    </span>
                    <p class="profile__navbar-name">Настройки</p>
                  </a>
                  <div class="line"></div>
                  <a href="#" class="profile__navbar-item selected">
                    <span class="profile__navbar-icon">
                      <svg width="19" height="19" class="icon-svg">
                        <use
                          href="../../assets/icon/icons.svg#reset_password"
                        ></use>
                      </svg>
                    </span>
                    <p class="profile__navbar-name">Сменить пароль</p>
                  </a>
                  <button
                    class="profile__navbar-item button-modal"
                    type="button"
                  >
                    <span class="profile__navbar-icon">
                      <svg width="20" height="19" class="icon-svg">
                        <use href="../../assets/icon/icons.svg#logout"></use>
                      </svg>
                    </span>
                    <p class="profile__navbar-name">выйт из аккаунта</p>
                  </button>
                </div>
              </div>
              <div class="profile-edit">
                <h2 class="profile__edit-title">Сменить пароль</h2>
                <div class="profile__edit-wrapper">
                  <div class="profile__edit-form">
                    <form class="edit__form-wrapper reset-password__form">
                      <div class="edit__form-content">
                        <div class="input__wrapper">
                          <input
                            class="form-input ui-input"
                            type="password"
                            name="current-password"
                            placeholder="Введите текущий пароль"
                          />
                          <div class="input-eye">
                            <svg width="24" height="25">
                              <use href="../../assets/icon/icons.svg#eye"></use>
                            </svg>
                          </div>
                        </div>

                        <div class="input__wrapper">
                          <input
                            class="form-input ui-input"
                            type="password"
                            name="new-password"
                            placeholder="Придумайте пароль"
                          />
                          <div class="input-eye">
                            <svg width="24" height="25">
                              <use href="../../assets/icon/icons.svg#eye"></use>
                            </svg>
                          </div>
                        </div>

                        <div class="input__wrapper">
                          <input
                            class="form-input ui-input"
                            type="password"
                            name="repeat-password"
                            placeholder="Повторите новый пароль"
                          />
                          <div class="input-eye">
                            <svg width="24" height="25">
                              <use href="../../assets/icon/icons.svg#eye"></use>
                            </svg>
                          </div>
                        </div>
                      </div>
                      <button
                        type="submit"
                        class="form-button ui-button button-light"
                      >
                        Сохранить
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Modal -->
      <div class="modal">
        <div class="modal__menu">
          <div class="modal__menu-wrapper">
            <h3 class="modal__menu-name">Выйти из аккаунта</h3>
            <p class="modal__menu-text">
              Вы уверены что хотите выйти из акканта?
            </p>
            <div class="modal__menu-buttons">
              <button class="modal-button modal__button-apply">Выйти</button>
              <button class="modal-button modal__button-close">Отмена</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mobile__navigation">
        <div class="mobile__navigation-wrapper">
          <a href="#" class="mobile__navigation-item">
            <span class="mobile__navigation-icon">
              <svg width="21" height="19">
                <use href="../../assets/icon/icons.svg#chat-nav"></use>
              </svg>
            </span>
            Chat
          </a>
          <a href="#" class="mobile__navigation-item">
            <span class="mobile__navigation-icon">
              <svg width="14" height="20">
                <use href="../../assets/icon/icons.svg#my_e-giris"></use>
              </svg>
            </span>
            My E-girls
          </a>
          <a href="#" class="mobile__navigation-item">
            <span class="mobile__navigation-icon">
              <svg width="16" height="20">
                <use href="../../assets/icon/icons.svg#lock"></use>
              </svg>
            </span>
            My Сontent
          </a>
          <a href="#" class="mobile__navigation-item">
            <span class="mobile__navigation-icon">
              <svg width="24" height="24">
                <use href="../../assets/icon/icons.svg#orders"></use>
              </svg>
            </span>
            Orders
          </a>
        </div>
      </div>
    </div>

    <div class="notification">
      <div class="notification__inner">
        <div class="notification-icon">
          <svg width="24" height="16">
            <use href="../../assets/icon/icons.svg#notification-success"></use>
          </svg>
        </div>
        <div class="notification__message">
          <p class="message">Пароль успешно изменен</p>
        </div>
        <button class="notification-close">
          <svg width="10" height="10">
            <use href="../../assets/icon/icons.svg#close"></use>
          </svg>
        </button>
      </div>
    </div>

    <script src="../../app/modal.js"></script>
  </body>
</html>
