<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot pass</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/authorization/authorization.css"
    />
  </head>
  <body>
    <div class="authorization">
      <div class="authorization__wrapper">
        <div class="authorization__block">
          <div class="authorization__block-inner authorization__block-forgot">
            <div class="authorization__top">
              <div class="authorization__logo">
                <svg width="212" height="62">
                  <use href="../../assets/icon/icons.svg#logo_dark"></use>
                </svg>
              </div>
              <div class="come-back__block">
                <a href="../Authorization/authorization.html" class="come-back">
                  <span>
                    <svg width="6" height="10">
                      <use href="../../assets/icon/icons.svg#arrow"></use>
                    </svg>
                  </span>
                  Вернуться назад
                </a>
              </div>
            </div>
            <div class="authorization__content authorization__forgot-content">
              <div class="forgot-block">
                <h2 class="forgot-pass">Забыли свой пароль?</h2>
                <p class="forgot-description">
                  Укажите свой Email или имя пользователя. Ссылку на создание
                  нового пароля вы получите по электронной почте.
                </p>
              </div>
              <div class="authorization-content">
                <form class="authorization__form forgot-password__form">
                  <div class="form-inputs">
                    <input
                      type="email"
                      class="ui-input input-required"
                      name="email"
                      placeholder="E-mail"
                    />
                  </div>
                  <div class="form-block">
                    <!-- <p class="form__err-message"></p> -->
                  </div>

                  <div class="form-button">
                    <button type="submit" class="ui-button">Continue</button>
                  </div>
                </form>
              </div>
            </div>
            <div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Валидация формы -->
    <script type="module" src="../../app/forgotPassword.js"></script>
  </body>
</html>
