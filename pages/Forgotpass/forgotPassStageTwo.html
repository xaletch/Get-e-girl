<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot pass</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/authorization/authorization.css"
    />
  </head>
  <body>
    <div class="authorization">
      <div class="authorization__wrapper">
        <div class="authorization__block">
          <div class="authorization__block-inner authorization__block-forgot">
            <div class="authorization__logo">
              <svg width="212" height="62">
                <use href="../../assets/icon/icons.svg#logo_dark"></use>
              </svg>
            </div>
            <div
              class="authorization__content authorization__forgot-content__finish"
            >
              <div class="forgot__block-message">
                <div class="forgot__block-message__inner">
                  <div class="forgot__message-icon">
                    <svg width="62" height="63">
                      <use
                        href="../../assets/icon/icons.svg#forgot-password"
                      ></use>
                    </svg>
                  </div>
                  <p class="forgot__message-text">
                    Ссылка для сброса пароля и дальнейших инструкций отправлена
                    вам на почту. Перейдите по ссылке и следуйте дальнейшим
                    инструкциям.
                  </p>
                </div>
              </div>
            </div>
            <div></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
