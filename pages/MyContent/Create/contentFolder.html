      <main class="main">
        <section class="my-content">
          <div class="container">
            <h1 class="title-page flex">
              <div>
                <a href="./editFolder.html" class="media__collection-back mobile">
                  <svg width="24" height="24">
                    <use
                      href="../../../assets/icon/icons.svg#edit-rofile"
                    ></use>
                  </svg>
                </a>

                  My content
                </span>
              </div>
              <a href="./myContent.html" class="media__collection-back mobile">
                <svg width="22" height="10">
                  <use
                    href="../../../assets/icon/icons.svg#go-back"
                  ></use>
                </svg>
              </a>
            </h1>
            <div class="content__wrapper content-wrapper">
              <!--  -->
              <div class="my-content__content">
                <!-- Для пользователей -->

                <div class="my-content__head my-content-head__block">
                  <div class="my-content__head-name">
                    <div class="content__head-img">
                      <img
                        src="../../../assets/images/subscribers-1.png "
                        alt="user"
                      />
                    </div>
                    <h2 class="content-username">My content</h2>
                  </div>
                  <a href="./editFolder.html" class="media__collection-back">
                    <span>
                      <svg width="24" height="24">
                        <use
                          href="../../../assets/icon/icons.svg#edit-rofile"
                        ></use>
                      </svg>
                    </span>
                    Редактировать папку
                  </a>
                </div>
                <div class="profile__content-inner">
                  <div class="user__media media__collection">
                    <div class="media__head content__media-head">
                      <div class="media__collection-name">
                        <h2>Subcribers</h2>
                        <div class="my-content-price">$20</div>
                        <div class="media__info-card">
                          <svg width="15" height="15">
                            <use
                              href="../../../assets/icon/icons.svg#image"
                            ></use>
                          </svg>
                          <span>11</span>
                        </div>
                      </div>
                      <a href="./myContent.html" class="media__collection-back">
                        <span class="goBack-icon">
                          <svg width="22" height="10">
                            <use
                              href="../../../assets/icon/icons.svg#go-back"
                            ></use>
                          </svg>
                        </span>
                        Вернуться назад
                      </a>
                    </div>

                    <div
                      class="user__media-inner user__media-collection my-content__media"
                    >
                      <div class="create__content-card add-content">

                          <div class="card-icon card__add-icon">
                            <svg width="26" height="26">
                              <use
                                href="../../../assets/icon/icons.svg#add"
                              ></use>
                            </svg>
                          </div>

                        </div>
                      </div>
                      <div

                        <div class="media__card-img media-img">

                      </div>
                      <div

                      >

                        <div class="private-icon">

                            <svg width="55" height="54">

                                href="../../../assets/icon/icons.svg#private"

                          <div class="private-price">24 $</div>

    <!-- Add new folder -->
    <div class="modal-big modal__big-folder">
      <div class="modal__block">
        <div class="modal__block-inner">
          <div class="modal-head">
            <button class="modal-close">
              <svg width="14" height="14">
                <use href="../../../assets/icon/icons.svg#close-madal"></use>
              </svg>
            </button>
            <h4 class="modal-name">Add new folder</h4>
          </div>
          <div class="modal-content modal__content-files">
            <div class="input-group">
              <div class="input__wrapper">
                <label for="name" class="input-label">Name</label>
                <input
                  class="ui__dark-input"
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Напишите название"
                />
              </div>
              <div class="input__wrapper">
                <label for="price" class="input-label">Цена ($)</label>
                <input
                  class="ui__dark-input"
                  type="text"
                  name="price"
                  id="price"
                  placeholder="Напишите цену"
                />
              </div>
            </div>
            <div class="upload-image">
              <input
                type="file"
                id="fileInput"
                accept=".jpeg, .jpg, .png, .bmp"
              />
              <label for="fileInput" class="upload-label">
                <div class="upload-text">Нажмите для загрузки</div>
              </label>
            </div>

            <div class="uploading__files">
              <div class="uploading__files-inner">
                <div class="files-item">
                  <img
                    class="files-img"
                    src="../../../assets/images/subscribers-9.png"
                    alt=""
                  />
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
                <div class="files-item file">
                  <svg width="24" height="24">
                    <use href="../../../assets/icon/icons.svg#pdf"></use>
                  </svg>
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
                <div class="files-item file">
                  <svg width="24" height="24">
                    <use href="../../../assets/icon/icons.svg#txt"></use>
                  </svg>
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-big__button modal__file-button">
            <button class="modal-btn modal__btn-cancel">Cancel</button>
            <button class="modal-btn modal__btn-confirm">Confirm</button>
          </div>
        </div>
      </div>
    </div>
