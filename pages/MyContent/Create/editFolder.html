                <span>

                      <div class="media__inf-block">

                        </div>

                        <span>
                          <svg width="24" height="24">
                            <use
                              href="../../../assets/icon/icons.svg#delete"
                            ></use>
                          </svg>
                        </span>

                      </button>
                      </div>
                    </div>

                              <use
                                href="../../../assets/icon/icons.svg#add"

          <div class="modal__menu-buttons">
            <button class="modal-button modal__button-apply">Удалить</button>
            <button class="modal-button modal__button-close">Отменить</button>
          </div>
