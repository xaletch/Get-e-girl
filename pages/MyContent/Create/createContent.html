<!DOCTYPE html>

  <body>
    <header class="header">

        <div class="header__wrapper">

              <use href="../../../assets/icon/icons.svg#logo_white"></use>
            </svg>
          </a>
          <div class="header__left">
            <a href="#" class="header-logo-eye">
              <svg width="80" height="49">
                <use href="../../../assets/icon/icons.svg#logo-eye"></use>
              </svg>
            </a>
            <!--  -->
            <div class="header__buttons">
              <!-- Уведомления -->
              <button class="header__buttons-btn">
                <div class="notification-count">12</div>
                <span>
                  <svg width="18" height="20">
                    <use
                      href="../../../assets/icon/icons.svg#notification"
                    ></use>
                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Язык -->
              <button class="header__buttons-btn">
                <span class="lang">
                  <svg width="28" height="20">

                  </svg>
                </span>
                <div class="header__buttons-arrow"></div>
              </button>
              <!-- Настройки -->
              <a
                href="../../profileSetting/profile.html"
                class="header__buttons-btn"

                <span>
                  <svg width="20" height="20">

                  </svg>
                </span>

              <button class="header__buttons-btn header__button-menu">
                <svg width="24" height="24">
                  <use href="../../../assets/icon/icons.svg#menu"></use>
                </svg>
              </button>
            </div>
          </div>
          <!--  -->
          <nav class="header__naw">
            <ul class="header__naw-list">
              <li class="header__list-item">
                <a href="../../profile/myProfile/feeds.html">Feeds</a>
              </li>
              <li class="header__list-item">
                <a href="../../Orders/orders.html">Orders</a>
              </li>
              <li class="header__list-item header__list-item__logo">
                <a href="#">
                  <svg width="220" height="32">
                    <use href="../../../assets/icon/icons.svg#logo-text"></use>
                  </svg>
                </a>
              </li>
              <li class="header__list-item">
                <a href="../../SubscribeManagement/subscribe.html"
                  >Subscribe management</a
                >
              </li>
              <li class="header__list-item">
                <a href="./myContent.html">Content</a>
              </li>
            </ul>
          </nav>
          <div class="header__user-info">
            <!-- БАЛАНС -->
            <a href="../../balance/finance.html" class="user-balance">
              <span class="balance-h">$12 310</span>
            </a>
            <!-- УВЕДОМЛЕНИЯ -->
            <button href="#" class="header__buttons-btn header__notif-btn">
              <div class="notification-count">12</div>
              <span>
                <svg width="18" height="20">
                  <use href="../../../assets/icon/icons.svg#notification"></use>
                </svg>
              </span>
              <div class="header__buttons-arrow"></div>
            </button>
            <!-- ПОЛЬЗОВАТЕЛЬ -->
            <div class="user">
              <div class="user-img">
                <img src="../../../assets/images/user.png" alt="user" />
              </div>
              <div class="user-name">@MoraruV</div>
            </div>
            <!-- МЕНЮ -->
            <button class="header__buttons-btn header__notif-btn">
              <svg width="24" height="24">
                <use href="../../../assets/icon/icons.svg#menu"></use>
              </svg>
            </button>
          </div>
          <div class="header__buttons">
            <!-- Уведомления -->
            <button class="header__buttons-btn">
              <div class="notification-count">12</div>
              <span>
                <svg width="18" height="20">
                  <use href="../../../assets/icon/icons.svg#notification"></use>
                </svg>
              </span>
              <div class="header__buttons-arrow"></div>
            </button>
            <!-- Язык -->
            <button class="header__buttons-btn">
              <span class="lang">
                <svg width="28" height="20">
                  <use href="../../../assets/icon/icons.svg#russia"></use>

              </span>
              <div class="header__buttons-arrow"></div>

            <!-- Настройки -->
            <a
              href="../../profileSetting/profile.html"
              class="header__buttons-btn"

              <span>
                <svg width="20" height="20">
                  <use href="../../../assets/icon/icons.svg#setting"></use>
                </svg>

                <use href="../../../assets/icon/icons.svg#menu"></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="create__contente">
        <div class="container">
          <h1 class="title-page">My content</h1>
          <div class="create__content-wrapper content__wrapper">
            <div class="create-content">
              <div class="create__content-head">
                <div class="content__head-img">
                  <img
                    src="../../../assets/images/subscribers-1.png "
                    alt="user"
                  />
                </div>
                <h2 class="content-username">Контент Eva</h2>
              </div>
              <div class="create__content-cards">
                <div class="create__content-card add-content">
                  <div class="card">
                    <div class="card-icon card__add-icon">
                      <svg width="26" height="26">
                        <use href="../../../assets/icon/icons.svg#add"></use>
                      </svg>
                    </div>
                    <h3 class="card-name">Add new folder</h3>
                  </div>
                </div>
                <div class="create__content-card add-content">
                  <a href="#" class="card">
                    <div class="card-icon">
                      <svg width="101" height="100">
                        <use
                          href="../../../assets/icon/icons.svg#picture"
                        ></use>
                      </svg>
                    </div>
                    <h3 class="card-name no-content">No content</h3>
                  </a>
                  <h4 class="create__content-card__name">Media on wall</h4>
                </div>
                <div class="create__content-card add-content">
                  <a href="#" class="card">
                    <div class="card-icon">
                      <svg width="101" height="100">
                        <use
                          href="../../../assets/icon/icons.svg#picture"
                        ></use>
                      </svg>
                    </div>
                    <h3 class="card-name no-content">No content</h3>
                  </a>
                  <h4 class="create__content-card__name">Subscription media</h4>
                </div>
                <div class="create__content-card add-content">
                  <a href="#" class="card">
                    <div class="card-icon">
                      <svg width="101" height="100">
                        <use
                          href="../../../assets/icon/icons.svg#picture"
                        ></use>
                      </svg>
                    </div>
                    <h3 class="card-name no-content">No content</h3>
                  </a>
                  <h4 class="create__content-card__name">Public media</h4>
                </div>
              </div>
            </div>
          </div>
          
        </div>
      </section>
    </main>

    <!-- Add new folder -->
    <div class="modal-big modal__big-folder">
      <div class="modal__block">
        <div class="modal__block-inner">
          <div class="modal-head">
            <button class="modal-close">
              <svg width="14" height="14">
                <use href="../../../assets/icon/icons.svg#close-madal"></use>
              </svg>
            </button>
            <h4 class="modal-name">Add new folder</h4>
          </div>
          <div class="modal-content modal__content-files">
            <div class="input-group">
              <div class="input__wrapper">
                <label for="name" class="input-label">Name</label>
                <input
                  class="ui__dark-input"
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Напишите название"
                />
              </div>
              <div class="input__wrapper">
                <label for="price" class="input-label">Цена ($)</label>
                <input
                  class="ui__dark-input"
                  type="text"
                  name="price"
                  id="price"
                  placeholder="Напишите цену"
                />
              </div>
            </div>
            <div class="upload-image">
              <input
                type="file"
                id="fileInput"
                accept=".jpeg, .jpg, .png, .bmp"
              />
              <label for="fileInput" class="upload-label">
                <div class="upload-text">Нажмите для загрузки</div>
              </label>
            </div>

            <div class="uploading__files">
              <div class="uploading__files-inner">
                <div class="files-item">
                  <img
                    class="files-img"
                    src="../../../assets/images/subscribers-9.png"
                    alt=""
                  />
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
                <div class="files-item file">
                  <svg width="24" height="24">
                    <use href="../../../assets/icon/icons.svg#pdf"></use>
                  </svg>
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
                <div class="files-item file">
                  <svg width="24" height="24">
                    <use href="../../../assets/icon/icons.svg#txt"></use>
                  </svg>
                  <button class="delete-item">
                    <svg width="7" height="7">
                      <use
                        href="../../../assets/icon/icons.svg#del-image"
                      ></use>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-big__button modal__file-button">
            <button class="modal-btn modal__btn-cancel">Cancel</button>
            <button class="modal-btn modal__btn-confirm">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../../app/modalFolder.js"></script>
  </body>
</html>
