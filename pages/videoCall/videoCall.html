            <div class="modal__menu-buttons">
              <button class="modal-button modal__button-apply">Выйти</button>

            </div>
          </div>
        </div>
      </div>

              <img src="../../assets/images/subscribers-8.png" alt="user">

              <p class="text">@Biancalop</p>
            </div>
            <h3 class="modal__menu-name">Включить камеру</h3>
