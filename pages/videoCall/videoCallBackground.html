<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/videCall/videoCall.css"
    />
  </head>
  <body>
    <div class="app">
      <div class="video__background">
        <div class="video__background-inner">
          <button class="video-close">
            <svg class="icon-close" width="24" height="24">
              <use href="../../assets/icon/icons.svg#video-close"></use>
            </svg>
          </button>

          <div class="video__background-content">
            <img src="../../assets/images/chat-img.png" alt="video" />

            <div class="vide-call__buttons">
              <div class="video__buttons-inner">
                <button class="video-button video__button-black">
                  <svg width="17" height="13">
                    <use href="../../assets/icon/icons.svg#camera-on"></use>
                  </svg>
                </button>
                <button class="video-button leave-button button-modal">
                  <svg width="35" height="15">
                    <use href="../../assets/icon/icons.svg#leave"></use>
                  </svg>
                </button>
                <button class="video-button video__button-black">
                  <svg width="24" height="24">
                    <use href="../../assets/icon/icons.svg#microphone"></use>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="video-chat__block-open">
            <a href="./videoCall-v3.html" class="video-chat__message">
              Вернуться на вкладку
              <span>
                <svg width="24" height="24">
                  <use href="../../assets/icon/icons.svg#back-chat"></use>
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
