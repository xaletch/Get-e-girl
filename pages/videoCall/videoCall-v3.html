<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video call</title>

    <link rel="stylesheet" href="../../assets/styles/styles.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/components/videCall/videoCall.css"
    />
  </head>
  <body>
    <div class="app">
      <div class="video-call video-call__chat-open">
        <div class="video-call__wrapper video-call__wrapper-xl">
          <!-- head -->
          <div class="video-call__head">
            <div class="video-call__head-inner">
              <div class="video-call-info">
                <a
                  href="./videoCallBackground.html"
                  class="video-call_come-back"
                >
                  <span>
                    <svg width="9" height="14">
                      <use href="../../assets/icon/icons.svg#come-back"></use>
                    </svg>
                  </span>
                  Video call
                </a>
                <div class="video-call__time">00:32:10</div>
              </div>
              <button class="video-call__extend">
                <span>
                  <svg width="25" height="24">
                    <use href="../../assets/icon/icons.svg#plus"></use>
                  </svg>
                </span>
                Продлить
              </button>
            </div>
          </div>

          <!-- video chat -->
          <div class="video-call__users">
            <div class="vide__container-xl">
              <div class="video__wrapper video__wrapper-xl">
                <div
                  class="video-call__users-wrapper video-call__users-wrapper-md"
                >
                  <!-- card 1 -->
                  <div class="video-card">
                    <div class="video__card-inner">
                      <!-- buttons -->
                      <div class="video__card-buttons">
                        <div class="video__card-btn">
                          <svg width="25" height="24">
                            <use
                              href="../../assets/icon/icons.svg#secure"
                            ></use>
                          </svg>
                        </div>
                      </div>
                      <!-- video -->
                      <div class="video__card-video">
                        <img
                          src="../../assets/images/chat-img.png"
                          alt="video"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- card 2 -->
                  <div class="video-card video-card-md">
                    <div class="video__card-inner">
                      <!-- buttons -->
                      <div class="video__card-buttons">
                        <div class="video__card-btn">
                          <svg width="25" height="24">
                            <use
                              href="../../assets/icon/icons.svg#secure"
                            ></use>
                          </svg>
                        </div>
                        <div class="video__card-btn">
                          <svg width="25" height="24">
                            <use
                              href="../../assets/icon/icons.svg#video-camera"
                            ></use>
                          </svg>
                        </div>
                      </div>
                      <!-- video -->
                      <div class="video__card-video video-block">
                        <img src="../../assets/images/video.png" alt="video" />
                      </div>
                    </div>
                  </div>
                </div>

                <!-- other users -->
                <div class="video__other-users chat-open">
                  <div class="others-users__inner">
                    <div class="other-user__card">
                      <!-- video -->
                      <div class="user-video">
                        <img
                          class="user__video"
                          src="../../assets/images/video-user.png"
                          alt="user"
                        />
                      </div>
                      <!-- video button action -->
                      <div class="video__card-action__btn">
                        <div class="action-button red">
                          <svg width="21" height="21">
                            <use
                              href="../../assets/icon/icons.svg#microphone-off"
                            ></use>
                          </svg>
                        </div>
                      </div>
                    </div>
                    <div class="other-user__card">
                      <div class="video__card-buttons">
                        <div class="video__card-btn">
                          <svg width="25" height="24">
                            <use
                              href="../../assets/icon/icons.svg#secure"
                            ></use>
                          </svg>
                        </div>
                        <div class="video__card-btn">
                          <svg width="25" height="24">
                            <use
                              href="../../assets/icon/icons.svg#video-camera"
                            ></use>
                          </svg>
                        </div>
                      </div>
                      <!-- video -->
                      <div class="user-video">
                        <img
                          class="user__video"
                          src="../../assets/images/video-user.png"
                          alt="user"
                        />
                      </div>
                      <!-- video button action -->
                      <div class="video__card-action__btn">
                        <div class="action-button green">
                          <svg width="21" height="21">
                            <use
                              href="../../assets/icon/icons.svg#speaks"
                            ></use>
                          </svg>
                        </div>
                      </div>
                    </div>
                    <div class="other-user__card">
                      <!-- video -->
                      <div class="user-video">
                        <img
                          class="user__video"
                          src="../../assets/images/video-user.png"
                          alt="user"
                        />
                      </div>
                      <!-- video button action -->
                      <div class="video__card-action__btn">
                        <div class="action-button red">
                          <svg width="21" height="21">
                            <use
                              href="../../assets/icon/icons.svg#microphone-off"
                            ></use>
                          </svg>
                        </div>
                      </div>
                    </div>
                    <div class="other-user__card">
                      <!-- video -->
                      <div class="user-video">
                        <img
                          class="user__video"
                          src="../../assets/images/video-user.png"
                          alt="user"
                        />
                      </div>
                      <!-- video button action -->
                      <div class="video__card-action__btn">
                        <div class="action-button red">
                          <svg width="21" height="21">
                            <use
                              href="../../assets/icon/icons.svg#microphone-off"
                            ></use>
                          </svg>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- video call buttons -->
              <div class="vide-call__buttons">
                <div class="video__buttons-inner">
                  <button class="video-button">
                    <svg width="23" height="23">
                      <use href="../../assets/icon/icons.svg#video-send"></use>
                    </svg>
                  </button>
                  <button class="video-button">
                    <svg width="17" height="13">
                      <use href="../../assets/icon/icons.svg#camera-on"></use>
                    </svg>
                  </button>
                  <button class="video-button leave-button button-modal">
                    <svg width="35" height="15">
                      <use href="../../assets/icon/icons.svg#leave"></use>
                    </svg>
                  </button>
                  <button class="video-button">
                    <svg width="24" height="24">
                      <use href="../../assets/icon/icons.svg#microphone"></use>
                    </svg>
                  </button>
                  <button class="video-button chat-open">
                    <svg width="24" height="24" class="icon">
                      <use href="../../assets/icon/icons.svg#video-close"></use>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- sound -->
          <div class="video-call__sound">
            <div class="sound">
              <div class="sound__track">
                <div class="sound__level"></div>
              </div>
              <div class="sound__icon">
                <svg width="15" height="14">
                  <use href="../../assets/icon/icons.svg#sound"></use>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- chat -->
        <div class="video-call_chat">
          <div class="chat__wrapper">
            <!-- chat head -->
            <div class="chat__head">
              <div class="chat__head-inner">
                <h2>Chats</h2>
              </div>
            </div>

            <!-- chat content -->
            <div class="chat__content">
              <div class="chat__messages">
                <div class="chat__messages-wrapper">
                  <!-- messages -->
                  <div class="chat__messages-message">
                    <!-- message 1 -->
                    <div class="chat__message">
                      <div class="chat__message-head">
                        <div class="message-data">
                          <div class="message__user-img">
                            <img
                              src="../../assets/images/subscribers-1.png"
                              alt="user"
                            />
                          </div>
                          <div class="message__user-data">
                            <h3 class="message-username">Author</h3>
                            <p class="message-text">Hello, Eva</p>
                          </div>
                        </div>
                        <div class="message-info">
                          <div class="message__info-date">12:00</div>
                          <div class="message-status">
                            <svg width="22" height="13">
                              <use
                                href="../../assets/icon/icons.svg#read"
                              ></use>
                            </svg>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- message 2 -->
                    <div class="chat__message">
                      <div class="chat__message-head">
                        <div class="message-data">
                          <div class="message__user-img">
                            <img
                              src="../../assets/images/subscribers-1.png"
                              alt="user"
                            />
                          </div>
                          <div class="message__user-data">
                            <h3 class="message-username">Author</h3>
                            <p class="message-text">Hello, Eva</p>
                          </div>
                        </div>
                        <div class="message-info">
                          <div class="message__info-date">12:00</div>
                          <div class="message-status">
                            <svg width="22" height="13">
                              <use
                                href="../../assets/icon/icons.svg#received"
                              ></use>
                            </svg>
                          </div>
                        </div>
                      </div>
                      <div class="chat__message-contents">
                        <img
                          class="chat__content-img"
                          src="../../assets/images/subscribers-8.png"
                          alt="#"
                        />
                      </div>
                    </div>

                    <!-- message 3 -->
                    <div class="chat__message">
                      <div class="chat__message-head">
                        <div class="message-data">
                          <div class="message__user-img">
                            <img
                              src="../../assets/images/subscribers-1.png"
                              alt="user"
                            />
                          </div>
                          <div class="message__user-data">
                            <h3 class="message-username">Author</h3>
                            <p class="message-text message__text-white">
                              Hello, Eva
                            </p>
                          </div>
                        </div>
                        <div class="message-info">
                          <div class="message__info-date">12:00</div>
                          <div class="message-status">
                            <svg width="22" height="13">
                              <use
                                href="../../assets/icon/icons.svg#read"
                              ></use>
                            </svg>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- send message -->
              <div class="chat__send-message">
                <div class="send__message-inner">
                  <!-- buttons -->
                  <div class="send__message-buttons">
                    <!-- загрузить документ/кртинку -->
                    <button class="message-button upload-button">
                      <svg width="24" height="24">
                        <use href="../../assets/icon/icons.svg#upload"></use>
                      </svg>
                    </button>
                    <!-- выбор смайликов -->
                    <button class="message-button icon-button">
                      <svg width="24" height="24">
                        <use href="../../assets/icon/icons.svg#chat-icon"></use>
                      </svg>
                    </button>
                  </div>

                  <!-- write message -->
                  <div class="write-message">
                    <input
                      class="write-message__input"
                      type="text"
                      name="message"
                      placeholder="Напишите сообщение..."
                    />
                  </div>

                  <!-- buttons -->
                  <div class="send__message-buttons">
                    <!-- записать голосовое -->
                    <button class="message-button voice-button">
                      <svg width="24" height="24">
                        <use
                          href="../../assets/icon/icons.svg#voice-message"
                        ></use>
                      </svg>
                    </button>
                    <!-- отправить сообщение -->
                    <button class="message-button send-button">
                      <svg width="24" height="24">
                        <use
                          href="../../assets/icon/icons.svg#send-message"
                        ></use>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal">
        <div class="modal__menu">
          <div class="modal__menu-wrapper">
            <h3 class="modal__menu-name">Выйти из лобби</h3>
            <p class="modal__menu-text">
              Вы уверены что хотите выйти из лобби ?
            </p>
            <div class="modal__menu-buttons">
              <button class="modal-button modal__button-apply">Выйти</button>
              <button class="modal-button modal__button-close">Отменить</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../app/modal.js"></script>
  </body>
</html>
