<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chose acc</title>

    <link rel="stylesheet" href="./assets/styles/styles.css" />
    <link
      rel="stylesheet"
      href="./assets/styles/components/authorization/authorization.css"
    />
    <link
      rel="stylesheet"
      href="./assets/styles/components/authorization/authorizationGender.css"
    />
  </head>
  <body>
    <div class="authorization">
      <div class="authorization__wrapper">
        <div class="authorization__block">
          <div class="authorization__block-inner">
            <div class="authorization__logo">
              <svg width="212" height="62">
                <use href="./assets/icon/icons.svg#logo_dark"></use>
              </svg>
            </div>
            <div class="authorization__gender">
              <h2 class="authorization-name authorization__gender-name">
                Registration
              </h2>
              <div class="gender__wrapper authorization-content">
                <div class="gender__block">
                  <div class="gender__card w">
                    <svg width="139" height="168">
                      <use href="./assets/icon/icons.svg#egerl"></use>
                    </svg>
                  </div>
                  <a href="#" class="gender-button">Sign in as egirl</a>
                </div>
                <div class="gender__block">
                  <div class="gender__card m">
                    <svg width="121" height="146">
                      <use href="./assets/icon/icons.svg#men"></use>
                    </svg>
                  </div>
                  <a href="#" class="gender-button">Sign in as user</a>
                </div>
              </div>
              <div class="authorization__message">
                Already have an account?
                <a href="#" class="authorization__message-link">Sign-in</a>
              </div>
            </div>
            <div></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
